:\"中钨高新\",\"BOARD_CODE\":\"683\",\"BOARD_NAME\":\"央国企改革\",\"IS_PRECISE\":\"1\",\"BOARD_RANK\":23},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"BOARD_CODE\":\"668\",\"BOARD_NAME\":\"医疗器械概念\",\"IS_PRECISE\":\"1\",\"BOARD_RANK\":24},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"BOARD_CODE\":\"523\",\"BOARD_NAME\":\"新材料\",\"IS_PRECISE\":\"1\",\"BOARD_RANK\":25},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"BOARD_CODE\":\"506\",\"BOARD_NAME\":\"创投\",\"IS_PRECISE\":\"1\",\"BOARD_RANK\":26}],\"hxtc\":[{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"经营范围\",\"MAINPOINT\":2,\"MAINPOINT_CONTENT\":\"硬质合金和钨、钼、钽、铌等有色金属及其深加工产品和装备的研制、开发、生产、销售及贸易业务;钢材、稀贵金属、化工产品及原料(专营除外)、矿产品、建材、五金工具、仪器仪表、电器器材、汽车配件、纺织品的贸易业务;旅游项目开发;进出口贸易按[1997]琼贸企审字第C166号文经营。\",\"KEY_CLASSIF\":\"经营范围\",\"KEY_CLASSIF_CODE\":\"002\",\"IS_POINT\":\"0\"},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"钨上游采选\",\"MAINPOINT\":3,\"MAINPOINT_CONTENT\":\"钨主要经济可采矿石类型包括黑钨矿与白钨矿，经破碎、磨矿、分级、选矿产出钨精矿。根据USGS数据显示，2025年全球钨矿储量超470万金属吨，集中分布于中国、澳大利亚、俄罗斯，2025年分别占比53%、12%、9%。2025年全球钨矿供应为8.5万吨金属量，中国为6.7万金属吨，占比79%，占据全球钨矿供应主导地位。根据中国钨业协会数据显示，2025年全国钨精矿产量13.06万标吨，同比增长0.1%。\",\"KEY_CLASSIF\":\"主营业务\",\"KEY_CLASSIF_CODE\":\"003\",\"IS_POINT\":\"0\"},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"钨冶炼加工\",\"MAINPOINT\":4,\"MAINPOINT_CONTENT\":\"钨精矿经分解、离子交换/萃取、蒸发结晶先行制得仲钨酸铵中间品，仲钨酸铵经还原气氛下煅烧产出氧化钨（WO3），氧化钨进一步在氢气气氛中加热还原为钨粉。钨粉主要用于生产钨丝、钨棒、钨管等钨材及钨合金，也可经配碳产出碳化钨粉，用于硬质合金生产。此外，钨精矿也可直接生产钨铁及钨酸钠，分别用于钨特钢与催化剂。根据中国钨业协会数据显示，2025年国内仲钨酸铵产量13.6万吨，同比增长6.3%。\",\"KEY_CLASSIF\":\"主营业务\",\"KEY_CLASSIF_CODE\":\"003\",\"IS_POINT\":\"0\"},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"硬质合金精深加工\",\"MAINPOINT\":5,\"MAINPOINT_CONTENT\":\"硬质合金制品终端广泛用于军工、航天航空、机械加工和电子通讯等领域，从消费结构来看，硬质合金约占钨消费量的65%；根据中国钨业协会数据，2025年国内硬质合金产量6.4万吨，同比增长6.7%，硬质合金的增长主要来自产品结构的优化。\",\"KEY_CLASSIF\":\"主营业务\",\"KEY_CLASSIF_CODE\":\"003\",\"IS_POINT\":\"0\"},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"有色金属行业\",\"MAINPOINT\":6,\"MAINPOINT_CONTENT\":\"公司从事的主要业务包括钨精矿、仲钨酸铵、钨粉及碳化钨粉、硬质合金和钨、钼、钽、铌等有色金属及其深加工产品和装备的研制、开发、生产、销售及贸易业务等。报告期内，公司主要业务及产品未发生变化。\",\"KEY_CLASSIF\":\"行业背景\",\"KEY_CLASSIF_CODE\":\"004\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"全产业链优势\",\"MAINPOINT\":7,\"MAINPOINT_CONTENT\":\"公司是中国五矿旗下钨产业的运营管理平台，管理及运营着集矿山、冶炼、加工与贸易于一体的完整钨产业链。公司受托管理范围内的钨资源储量、钨冶炼年生产能力均居全球第一，有力保障了加工端原材料的供应，增强抗风险能力，有利于整合上下游资源进行统一调配及优化配置，提高资源利用效率。\",\"KEY_CLASSIF\":\"核心竞争力\",\"KEY_CLASSIF_CODE\":\"005\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"产品优势\",\"MAINPOINT\":8,\"MAINPOINT_CONTENT\":\"规模优势。报告期内公司年产硬质合金1.63万吨，全球第一。公司产品涵盖粉末、耐磨材料、精密零件、切削刀具、精密工具等1万多种规格，为同行业中产品种类最齐全的企业。其中棒型材、球齿、轧辊、精密零件产量位居全球第一。\",\"KEY_CLASSIF\":\"核心竞争力\",\"KEY_CLASSIF_CODE\":\"005\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"科技创新优势\",\"MAINPOINT\":9,\"MAINPOINT_CONTENT\":\"公司秉承“创新驱动、科技引领”可持续发展战略，持续加强科研项目布局和科研平台建设，布局基础性、紧迫性、前沿性、颠覆性等原创性技术研究，培育和发展战略新兴产业和未来产业，以系列重磅科技成果为我国高质量发展注入“钨”力量，全面提升公司科技创新水平和科技管理水平，不断提升公司核心竞争力。\",\"KEY_CLASSIF\":\"核心竞争力\",\"KEY_CLASSIF_CODE\":\"005\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"智能制造优势\",\"MAINPOINT\":10,\"MAINPOINT_CONTENT\":\"公司高度重视智能化建设，坚持全产业链协同推进。在矿山领域，公司统筹四大统建系统全面落地，柿竹园公司率先建成“5G+工业互联网”平台与智能管控中心，实现采选全过程可视化调度与数据驱动决策，推动生产模式向“设备地下运行、人员地面作业”变革，并成功获评湖南省智能化示范矿山。在冶炼与合金环节，公司同步加快数字化升级，推动生产管控一体化平台部署。在精密工具领域，金洲公司以建设“黑灯工厂”为目标，聚焦柄径精磨、钻径精磨、钻径开槽、清洗、打字等工序，打造全流程自动化车间。通过定制化自动物流设备、总控软件、电气控制程序开发及自动化网络部署，实现了从物料转运到加工、检测的全链条无人化运行，车间数智化水平行业领先。目前，中钨高新已构建起覆盖矿山、冶炼、合金全产业链的智能制造体系，形成了“井下无人化、工厂黑灯化、管控智慧化”的转型新格局，为企业高质量发展注入强劲动能。\",\"KEY_CLASSIF\":\"核心竞争力\",\"KEY_CLASSIF_CODE\":\"005\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"拟定增募资逾15亿元投资硬质合金项目\",\"MAINPOINT\":12,\"MAINPOINT_CONTENT\":\"2018年10月31日公告,公司拟非公开发行股票不超1.76亿股,募资不超15.29亿元,扣除发行费用后的募集资金净额拟投资于2,000吨/年高端硬质合金棒型材生产线技术改造项目、硬质合金产品提质扩能建设项目、精密工具产业园建设项目和补充流动资金。公司同日公告,公司下属控股子公司株钻公司以人民币1.49亿元现金,收购五矿国际持有的德国HPTecGmbH公司100%的股权。HPTec总部位于德国的拉芬斯堡,是欧洲最大的从事PCB(电子电路板)用硬质合金微型钻头和铣刀的制售的国际知名精密工具生产厂商。\",\"KEY_CLASSIF\":\"增发股份\",\"KEY_CLASSIF_CODE\":\"007001\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"000657.SZ\",\"SECURITY_CODE\":\"000657\",\"SECURITY_NAME_ABBR\":\"中钨高新\",\"KEYWORD\":\"被纳入国企改革“双百企业”名单\",\"MAINPOINT\":11,\"MAINPOINT_CONTENT\":\"2018年8月14日公告,国务院国有企业改革领导小组决定选取百余户中央企业子企业和百余户地方国有骨干企业,在2018-2020年期间实施国企改革双百行动。公司被纳入本次国企改革双百企业名单。\",\"KEY_CLASSIF\":\"其他项目\",\"KEY_CLASSIF_CODE\":\"010\",\"IS_POINT\":\"1\"}]}"