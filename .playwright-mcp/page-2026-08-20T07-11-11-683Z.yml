            - strong [ref=f3e779]: 市盈率（TTM）
            - text: ） 解释说明
          - generic [ref=f3e780]:
            - strong [ref=f3e781]: 市盈率（TTM）
            - text: 可以看作是公司赚回你为股票支付的价格所花费的年数。例如，如果一家公司
            - link "稀释每股收益" [ref=f3e782] [cursor=pointer]:
              - /url: /stock/SZSE:000657/term/eps_diluated
            - text: 为2美元，并且该股票的交易价格为30美元，则市盈率为15。因此，假设公司在未来15年内的收入保持不变，公司需要花15年赚回你购买股票支付的30美元。
          - generic [ref=f3e783]: 在实际业务中，收入不会永远保持恒定。如果公司收入增长，那么公司就可以用更少的时间就赚回你为股票支付的价格。如果公司收入下降，则需要更长的时间。作为股东，你希望公司尽快收回你所支付的价格。因此，只要市盈率是正数，低市盈率股票就比高市盈率股票更具吸引力。同样，对于市盈率相同的股票，成长能力更强的股票更具吸引力。
          - generic [ref=f3e784]: 如果公司亏钱，市盈率将变得毫无意义。
          - generic [ref=f3e785]:
            - text: 为了比较具有不同增长率的股票，彼得·林奇（Peter Lynch）引入了
            - link "市盈增长比" [ref=f3e786] [cursor=pointer]:
              - /url: /stock/SZSE:000657/term/peg_ratio
            - text: 。 市盈增长比的定义为市盈率除以增长率。他认为市盈率与其增长率相等的公司价值是公允计量的。但他也表示，相比一家年增长率为10％，市盈率为10的公司，他更愿意收购一家年增长率为20％，市盈率为20的公司。
          - generic [ref=f3e787]: 由于市盈率衡量的是公司收回支付价格的时间，因此该比率可以应用于不同行业的股票。这也是它成为股票估值中最重要、最常用的指标之一的原因。
          - generic [ref=f3e788]:
            - text: 类似于
            - link "市销率" [ref=f3e789] [cursor=pointer]:
              - /url: /stock/SZSE:000657/term/ps_ratio
            - text: ，
            - link "股价／每股经营现金流" [ref=f3e790] [cursor=pointer]:
              - /url: /stock/SZSE:000657/term/price_to_operating_cash_flow
            - text: 或
            - link "股价／自由现金流" [ref=f3e791] [cursor=pointer]:
              - /url: /stock/SZSE:000657/term/price_to_free_cash_flow
            - text: ，
            - strong [ref=f3e792]: 市盈率（TTM）
            - text: 根据公司的盈利能力来衡量估值。这与
            - link "市净率" [ref=f3e793] [cursor=pointer]:
              - /url: /stock/SZSE:000657/term/pb_ratio
            - text: 不同，后者根据公司的资产负债表衡量估值。
          - separator [ref=f3e794]
          - heading [level=2] [ref=f3e795]:
            - strong [ref=f3e796]: 中钨高新
            - strong [ref=f3e797]: 市盈率（TTM）
            - text: （000657
            - strong [ref=f3e798]: 市盈率（TTM）
            - text: ） 注意事项
          - generic [ref=f3e799]:
            - strong [ref=f3e800]: 市盈率（TTM）
            - text: 经常会产生误导，尤其是当公司业务具有周期性且不可预测时。正如彼得·林奇（Peter Lynch）所指出的，周期性企业在商业周期的繁荣期具有更高的利润率。这些企业收入很高，而市盈率则出奇地低。在市盈率较低时购买周期性企业通常不是明智的决定。此时，
            - link "市销率" [ref=f3e801] [cursor=pointer]:
              - /url: /stock/SZSE:000657/term/ps_ratio
            - text: 则是确定周期性企业购买时机的一个更优指标。
          - generic [ref=f3e802]:
            - strong [ref=f3e803]: 市盈率（TTM）
            - text: 也可能受到非经常性项目的影响，例如出售部分业务，可能会使得本年度/季度的这一项目急剧增加。但这一增加是不可能反复出现的。因此
            - link "持续经营市盈率" [ref=f3e804] [cursor=pointer]:
              - /url: /stock/SZSE:000657/term/penri
            - text: 是比
            - strong [ref=f3e805]: 市盈率（TTM）
            - text: 更准确的一个衡量估值的指标。
