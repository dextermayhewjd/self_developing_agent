批准的项目外,凭营业执照依法自主开展经营活动)许可项目:非煤矿山矿产资源开采;检验检测服务;第二类医疗器械生产。(依法须经批准的项目,经相关部门批准后方可开展经营活动,具体经营项目以相关部门批准文件或许可证件为准)\",\"KEY_CLASSIF\":\"经营范围\",\"KEY_CLASSIF_CODE\":\"002\",\"IS_POINT\":\"0\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"钨产业\",\"MAINPOINT\":3,\"MAINPOINT_CONTENT\":\"公司拥有完整的钨产业链，在钨矿开采、钨冶炼、钨粉末、钨丝材和硬质合金深加工领域拥有较为突出的竞争优势。钨矿山业务方面，公司拥有三家在产钨矿企业（洛阳豫鹭，宁化行洛坑，都昌金鼎）和一家在建钨矿企业（博白巨典），现有在产钨矿山钨精矿（65%WO3）年产量约12,000吨，为后端钨的深加工提供了稳定的资源保障。钨冶炼及粉末方面，公司具备钨冶炼及粉末产品大规模生产能力，规模与品质处于世界前列。钨制品方面，公司是国内首家具备核聚变装置用ITER偏滤器钨探针组件研发和生产能力的企业，具备大尺寸ITER级钨材料的精密机加工成型能力，可满足EAST、ITER等不同磁约束聚变装置部件的高标准需求，为ITER等国内外聚变客户提供多款钨产品及部件。钨丝材方面，公司生产的钨丝多年稳居行业市场份额前列，经年积累的钨丝技术开发能力、加工能力、设备制造能力、规模生产能力奠定了公司在钨丝加工领域的领先地位，公司生产的光伏用钨丝产品具有韧性好、线径细、断线率低等特点，可有效提升硅片加工企业生产效率，公司光伏用钨丝产品具有完全自主知识产权，拥有十余件发明专利及实用新型专利。除用于光伏领域硅片切割之外，公司钨丝产品还用于耐切割防护、汽车玻璃、微波炉、真空镀膜、医疗器械、照明等多个领域。硬质合金方面，公司生产的硬质合金产品定位中高端，产品质量优，产销规模为国内前列，其中硬质合金棒材依托高品质的自供原料和先进的工艺体系，产品系列齐全，性能卓越稳定，在海内外取得极高的品牌美誉度，为国际知名刀具品牌优质供应商。切削工具方面，公司生产的刀具刀片产品定位中高端，拥有较高的研发实力。公司建立了切削工具的四大共性技术平台，即材料技术、结构技术、工艺技术和切削应用技术，紧跟市场需求进行新品研发与产品迭代升级，持续丰富产品系列与物料种类以满足各大应用领域及加工工况，目前已拥有超过12万个产品规格；公司与成飞集团、上飞公司、豪迈科技、精雕、吉利汽车、比亚迪、国茂减速机等行业大型、知名企业建立了良好合作关系，能够满足航空航天、设备制造业、新能源汽车等高端制造业产品零部件的加工需求；同时，公司通过与下游应用领域标杆客户的紧密合作，持续构建解决方案技术能力，深入探索解决方案业务模式，已积累了覆盖汽车、航空航天、能源重工、通用机械等各大应用领域的超300个零部件方案包，为终端用户提供机床交钥匙方案定制、产线刀具总包、工艺改善等服务，逐步实现从卖产品向提供整体解决方案的转变。凿岩工程工具方面，公司是国内领先的凿岩工具、工程工具供应商，公司生产的螺纹钎具、煤截齿、掘进齿、盾构刀具等产品采用量身打造的硬质合金牌号和优化的产品工艺设计，为巷道掘进、井下、露天开采、隧道以及大型工程建设等提供优质可靠的“金鹭”系列产品。公司多款“金鹭”牌钨合金和“虹鹭”牌钨丝产品获得国家重点新产品和福建省名牌产品称号。\",\"KEY_CLASSIF\":\"主营业务\",\"KEY_CLASSIF_CODE\":\"003\",\"IS_POINT\":\"0\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"钼产业\",\"MAINPOINT\":4,\"MAINPOINT_CONTENT\":\"公司充分发挥自身独特的绿色钼冶炼技术和国际先进的钼粉末加工技术，已建成全球前列的绿色冶炼钼产业链生产基地。钼冶炼、钼粉末已实现全流程自动化生产，钼深加工制品产品种类丰富，运用范围广，主要产品钼酸铵、钼粉、钼条、钼片、钼坩埚制品、钼丝等广泛应用于石油化工、高温合金、航空航天、半导体、机械加工、耐磨件喷涂和电光源等领域，钼酸铵、钼粉、钼丝等产品市场占有率居全球前列。\",\"KEY_CLASSIF\":\"主营业务\",\"KEY_CLASSIF_CODE\":\"003\",\"IS_POINT\":\"0\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"稀土产业\",\"MAINPOINT\":5,\"MAINPOINT_CONTENT\":\"公司构建了覆盖稀土全产业链的协同体系，前端通过战略参股方式布局矿山开采及冶炼分离环节，确保上游资源稳定供应，后端以自主控股形式深度开发高附加值领域，涵盖稀土高纯氧化物、稀土金属加工、发光材料、高性能磁性材料、光电晶体的全产业链闭环，是国家重点稀土集团，具有较高的行业地位。在稀土资源方面，国内资源整合后，公司参股中稀厦钨，共同开发福建稀土资源，同时与赤峰黄金合作共同开发海外稀土资源；在稀土冶炼分离方面，公司与中国稀土集团、北方稀土合作建设、运营稀土冶炼分离产业，推动稀土资源高质化利用，为公司稀土产业提供原料保障。公司在做好稀土深加工产业的同时，积极探索稀土应用，利用自身在稀土永磁材料产业的基础优势，培育发展稀土永磁电机业务，在工业节能、伺服电机、汽车电机、现代农业、绿色环保等领域进行布局。\",\"KEY_CLASSIF\":\"主营业务\",\"KEY_CLASSIF_CODE\":\"003\",\"IS_POINT\":\"0\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"能源新材料产业\",\"MAINPOINT\":6,\"MAINPOINT_CONTENT\":\"公司能源新材料板块主要从事新能源电池材料的研发、生产和销售。主要产品为高电压钴酸锂、高电压三元材料、高功率三元材料、高镍三元材料、氢能材料、磷酸铁锂等，广泛应用于新能源汽车、3C消费电子、储能等领域。借助于多年来技术研发和生产实践积累形成的技术研发优势和产品质量优势，公司执行大客户战略，拓展了国内外众多知名电池客户。在3C锂电池领域，公司与ATL、三星SDI、村田、LGC、欣旺达、珠海冠宇及比亚迪等国内外知名电池企业建立了稳固的合作关系，产品广泛应用到下游中高端3C电子产品中；在动力锂电池领域，公司与中创新航、松下、新能安、比亚迪、欣旺达、宁德时代及国轩高科等知名电池企业建立了稳定的合作关系。公司紧跟市场需求进行新产品研发，通过与下游核心客户的紧密合作，持续进行工艺技术优化和产品迭代。公司持续巩固在钴酸锂、氢能材料细分领域的行业领先地位，逐步提升三元材料的产品竞争力，通过差异化竞争逐步拓展磷酸铁锂市场份额，同时公司积极探索下一代新能源材料技术的前沿理论和前沿技术，分析和整合行业发展趋势，进行专题攻关，推进前沿产品研发和技术孵化，探索适合商业化、产业化的前沿产品储备，大力开发下一代新能源材料产品。\",\"KEY_CLASSIF\":\"主营业务\",\"KEY_CLASSIF_CODE\":\"003\",\"IS_POINT\":\"0\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"钨产业\",\"MAINPOINT\":7,\"MAINPOINT_CONTENT\":\"近年来，在国家推动高质量发展，制造业转型升级，深化供给侧结构性改革以及保障产业链、供应链安全稳定的背景下，国产化进口替代提速。“一带一路”政策推动沿线基础设施加快建设，以及全球地缘政治风险加剧下国防投入增加等都将拉动钨在先进制造、工程建设、航空航天、国防军工、生物医疗等高端应用领域的消费增长，钨制品应用领域正在持续扩大，市场前景广阔。钨深加工领域，伴随国内产业结构持续优化、制造业加快转型升级，叠加大规模设备更新、消费品以旧换新政策落地，以及智能制造、新能源等新兴技术与产业快速发展，相关领域产品置换与新增购置需求稳步释放，机床数控化水平持续提升等，全球硬质合金及切削工具市场需求总量有望继续增长。与此同时，航空航天、汽车、电子信息、新能源、高端模具等先进制造领域对高精度、高性能、复杂型刀具的需求日益迫切，将持续推动刀具行业向高端化、精密化、专用化方向升级，我国刀具行业整体发展前景广阔。根据中国机床工具工业协会预测，我国刀具市场规模有望在2030年达到631亿元，复合增长率达4.14%。\",\"KEY_CLASSIF\":\"行业背景\",\"KEY_CLASSIF_CODE\":\"004\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"钼产业\",\"MAINPOINT\":8,\"MAINPOINT_CONTENT\":\"钼作为战略性金属，其市场规模和应用领域不断扩大。由于具备熔沸点、密度、强度较高，导电与热性能优异等特征，钼被广泛应用于高温合金、电子散热、国防军工等关键领域，有“战争金属”之称。近年来，全球钼资源的分布和开采情况呈现出高度集中化的趋势，中国、美国、智利等国家是主要的钼矿产地。钼的应用领域以钢铁行业为主，合金钢、不锈钢等产品是钼的主要消费方向，占比超过60%。近年来我国钼消费主要用于钢铁行业，随着国内经济动能从传统基建、地产向高端制造业转移，钢材需求从普钢向含钼钢转变。同时钼在新能源、新材料、航空航天等高附加值领域的广泛应用，使得其消费量持续增长，如掺钼的钢材因其优异的性能被广泛用于输油管道、热交换管道、海上建筑等高温、腐蚀性强的环境中。此外，钼在新兴领域研究和应用也得到快速发展，如在金属陶瓷、难熔材料复合板、纳米级钼金属材料、高温涂层、高科技领域的靶材以及镀膜玻璃等行业的研究和应用，这些不断拓展并升级着钼的应用领域。未来随着科学技术的发展，钼以其独特的性能，应用会越来越广泛。\",\"KEY_CLASSIF\":\"行业背景\",\"KEY_CLASSIF_CODE\":\"004\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"稀土产业\",\"MAINPOINT\":9,\"MAINPOINT_CONTENT\":\"稀土是国家《全国矿产资源规划（2016-2020年）》战略性矿产目录中重要战略矿产资源之一，稀土功能材料是国家《战略性新兴产业重点产品和服务指导目录（2016年版）》的战略性新兴产业之一。因稀土具有优异的光、电、磁、超导、催化等物理性能，有“工业维生素”的美誉，微量加入便可大幅提升材料性能，是全球不可或缺的战略资源。可用于生产永磁、催化、储氢、抛光、精密陶瓷、荧光、激光、光导纤维等材料，稀土在新能源、新材料、节能环保、航空航天、军工、电子信息等领域的应用日益广泛。近年来，国家持续强化对稀土行业及企业的监管，通过实行开采、分离总量控制、加强安全环保督察、建立企业公示制度、编制管理条例等措施，规范稀土行业经营秩序，促进稀土行业管理体系的进一步完善，有助于稀土行业及企业提升经营质量、优化结构调整和推进转型升级。随着世界各国纷纷大力投资低碳节能环保制造产业，大力推动绿色节能环保产品的应用和消费，随着新能源汽车、风力发电、节能家电、机器人和智能制造等为代表的新兴产业快速发展，高性能稀土永磁材料的需求有望迎来较快增长。电机行业方面，2025年中国电机行业呈现“传统改造+新兴增量”的双轮驱动格局，行业规模持续扩大。传统的高耗能行业的设备更新需求持续释放，老旧电机替换与能效提升改造成为市场主流；新兴的新能源汽车、工业机器人、低空经济等产业发展，催生了对特种电机、精密控制电机的差异化需求。\",\"KEY_CLASSIF\":\"行业背景\",\"KEY_CLASSIF_CODE\":\"004\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"能源新材料产业\",\"MAINPOINT\":10,\"MAINPOINT_CONTENT\":\"锂离子电池正极材料是新能源电池最为核心的关键材料，其性能直接决定了新能源电池容量、安全性等各项性能指标。锂离子电池正极材料是《战略性新兴产业分类（2018）》目录中的重要产品之一，广泛应用于新能源汽车、3C电子产品、储能电池等领域。目前市场上主流的锂电池正极材料有三元材料（NCM、NCA）、磷酸铁锂、钴酸锂以及锰酸锂，四种材料因各自的特性差异应用于不同领域。经过十多年的发展，我国已经成为全球锂电池正极材料主要的制造国之一，其中，我国在钴酸锂及锰酸锂材料方面目前已成为世界最大出口国，磷酸铁锂及三元正极材料成为世界最大生产国及使用国。伴随全球电动汽车市场从政策向消费驱动转变，以及全球应对气候变化的决心持续加强，新能源汽车飞速发展。同时，在全球能源转型与政策支持的背景下，叠加成本优势与技术进步，产业链协同以及AI算力与数据中心快速发展，储能将迎来爆发期，有望成为锂电行业的第二增长极。正极材料的技术趋势正朝着高压化、高镍化、高倍率、单晶化发展，磷酸铁锂电池受益于技术、成本、安全等因素，在新能源汽车领域渗透率加速提升，在储能领域应用快速提升。随着行业由政策驱动转向市场化增长、产业链盈利持续修复，锂离子电池正极材料市场景气度也在逐步提升。\",\"KEY_CLASSIF\":\"行业背景\",\"KEY_CLASSIF_CODE\":\"004\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"资源保障能力\",\"MAINPOINT\":11,\"MAINPOINT_CONTENT\":\"公司拥有三家在产钨矿企业（洛阳豫鹭、宁化行洛坑、都昌金鼎）和一家在建钨矿企业（博白巨典），为后端钨的深加工提供了稳定的资源保障；公司作为国家重点稀土集团，与中国稀土集团在福建稀土矿业开发、福建稀土冶炼分离产业、福建稀土深加工产业的原料保障、稀土产业基金及创新领域开展广泛的合作，共同推动福建省稀土产业高质量发展，同时公司与赤峰吉隆黄金矿业股份有限公司合作成立合资公司开发老挝稀土资源，促进公司提升稀土资源的保障能力；公司加强与锂电池正极材料上游企业合作，公司现为腾远钴业第三大股东，同时公司控股子公司厦钨新能分别与盛屯矿业集团股份有限公司、雅化锂业（雅安）有限公司、中色国际贸易有限公司等上游企业合作成立合资公司，为公司电池材料提供了一定的原料保障。报告期内，权属矿山公司宁化行洛坑持续推进矿区深部勘查工作，本项目可为行洛坑矿区长远有序开采提供规划依据，为公司深加工产业对钨资源的需求提供可持续保障。截至报告日，公司已完成收购九江大地69%股权的股权变更登记工作，同时积极推进江西巨通股权收购方案的合作事宜；前述收购完成后，公司资源保障能力将大幅提升。\",\"KEY_CLASSIF\":\"核心竞争力\",\"KEY_CLASSIF_CODE\":\"005\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"技术研发优势\",\"MAINPOINT\":12,\"MAINPOINT_CONTENT\":\"公司拥有专业高效的研发团队，聚焦钨钼、稀土和能源新材料三大产业的基础理论研究和应用技术开发，依托国家钨材料工程技术中心、高端储能材料国家地方联合工程研究中心和福建省稀土材料及应用工程技术研究中心，通过持续的自主创新和较强的研发能力，解决了多项国家层面产业链供给安全的“卡脖子”问题，推动了行业技术的进步。报告期内，公司承担了国家重点研发计划项目等国家各级科研项目71项，组织开展企业级重大重点研发项目25项，参与制定国家及行业标准34个，取得多项具有突破性的科研成果。其中：“高强高硬低磨耗新型纳米瓷球磨矿成套技术及其工业应用”获江西省科学技术进步一等奖，“高端溅射靶材用高纯金属钼粉关键制备技术及应用”获四川省科技进步一等奖，“光伏晶硅切割用高强钨合金微丝的开发与应用”获福建省科技进步二等奖，“钕铁硼永磁材料晶界调控与重稀土高效利用关键技术及产业化”和“离子型稀土原地浸矿基础理论与数字化精准开采技术”获江西省科学技术进步二等奖。报告期内，公司新增了科技荣誉及资质20项，包含“卓越级智能工厂”等国家级荣誉2项，“2025福建制造业企业100强”等省级荣誉7项，“厦门市先进级智能工厂”等市级荣誉11项。\",\"KEY_CLASSIF\":\"核心竞争力\",\"KEY_CLASSIF_CODE\":\"005\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"产业链优势\",\"MAINPOINT\":13,\"MAINPOINT_CONTENT\":\"公司拥有完整钨产业链，一体化产业链使公司能够根据产业链上下游的技术变化、产能变化、市场与客户变化等灵活改变产品组合，更多地参与到附加值高的深加工业务领域中去。近年来，公司在过往产品结构调整的基础上，进一步明确各生产基地的产品和市场分工，推进各基地的产品升级、转型和结构调整。公司构建了覆盖稀土全产业链的协同体系：前端通过战略参股方式布局矿山开采及冶炼分离环节，确保上游资源稳定供应；后端以自主控股形式深度开发高附加值领域，涵盖稀土高纯氧化物、稀土金属加工、发光材料、磁性材料、光电晶体的全产业链闭环。\",\"KEY_CLASSIF\":\"核心竞争力\",\"KEY_CLASSIF_CODE\":\"005\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"品牌优势\",\"MAINPOINT\":14,\"MAINPOINT_CONTENT\":\"公司产品质量稳定，有较高的美誉度。公司生产的钨钼材料产品、硬质合金棒材、切削工具、钨钼丝材、电池材料、稀土产品质量可靠，在客户中具有一定的品牌效应，在业界有较高的知名度和口碑，曾被客户授予“最满意供应商”、“最佳供应商”、“突出贡献奖”等荣誉认可。公司仲钨酸铵、硬质合金、节能灯用钨丝、氧化镥、钴酸锂电池材料等多个产品先后被评为“制造业单项冠军产品”。公司入选2025年《财富》中国500强第395位。良好的品牌形象和市场影响力，也是公司赢得客户信任和信赖的基础。\",\"KEY_CLASSIF\":\"核心竞争力\",\"KEY_CLASSIF_CODE\":\"005\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"拟在龙岩新罗设立钨冶炼合资公司\",\"MAINPOINT\":19,\"MAINPOINT_CONTENT\":\"2018年9月21日公告,公司与龙岩市新罗区政府、福建金鑫钨业股份有限公司签署意向协议。公司、福建金鑫拟合资成立的企业(其中公司出资51%、福建金鑫出资49%)投资11.9亿元在雁石经济开发区建设年产1万吨APT(仲钨酸铵)生产线及相关配套设施,达产后预计年销售收入15亿元。新罗区政府支持公司、福建金鑫在雁石经济开发区建设钨冶炼生产基地,支持解决钨冶炼建设遇到的问题,使项目建设顺利进行,并给予合资公司优惠政策支持。\",\"KEY_CLASSIF\":\"对内扩张\",\"KEY_CLASSIF_CODE\":\"006001\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"科陆电子拟受让赣州腾远控股权\",\"MAINPOINT\":15,\"MAINPOINT_CONTENT\":\"2018年4月11日公告,公司收到参股公司赣州腾远钴业新材料股份有限公司发来的《致股东的函》:赣州腾远首次公开发行股票申请未获通过后,其实控人罗洁、谢福标、吴阳红拟将其控制的赣州腾远65.57%股权转让给科陆电子(002121),科陆电子将以现金加发行股份方式受让该部分股权。转让完成后,科陆电子将成赣州腾远控股股东。赣州腾远100%股权预估值为人民币39亿元,科陆电子有以同等条件收购赣州腾远剩余股权的意向,截至公告日,公司持有赣州腾远1140万股股份,占赣州腾远股份总数的15%,初始投资金额为1.18亿元。\",\"KEY_CLASSIF\":\"对外扩张\",\"KEY_CLASSIF_CODE\":\"006002\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"拟20亿元投建稀土永磁电机园区\",\"MAINPOINT\":17,\"MAINPOINT_CONTENT\":\"2018年6月27日公告,公司及下属公司厦钨电机与厦门市集美区政府签署关于永磁电机项目的协议,将在厦门市集美区灌口镇投资建设永磁电机园区,并牵头招商引资发展稀土永磁电机产业,打造电机产业集群。公司将通过直接投资或产业发展基金投资的方式,对入住园区内的永磁电机企业进行投资。公司将作为基石投资者,出资约20亿元,与其他投资者共同设立产业发展基金,募资约100亿元,投资永磁电机项目。\",\"KEY_CLASSIF\":\"对外扩张\",\"KEY_CLASSIF_CODE\":\"006002\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"与中钨高新战略合作\",\"MAINPOINT\":16,\"MAINPOINT_CONTENT\":\"2018年5月10日公告,公司与中钨高新签署战略合作协议,双方决定在钨资源开发、冶炼、粉末及深加工、各权属公司业务往来等方面开展交流合作,建立战略合作伙伴关系。具体内容包括,鼓励下属企业建立长期稳定的上下游供需关系;相互开放国家硬质合金重点实验室和钨材料工程技术研究中心;探讨和建立海外业务合作发展的平台等内容。\",\"KEY_CLASSIF\":\"其他扩张\",\"KEY_CLASSIF_CODE\":\"006004\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"筹划员工持股计划\",\"MAINPOINT\":18,\"MAINPOINT_CONTENT\":\"2018年8月7日公告,公司拟推出员工持股计划,该计划所持有的股票总数累计不超过公司股本总额的10%,单个员工所获股份权益对应的股票总数累计不超过公司股本总额的1%。本次员工持股计划拟于2018年8月23日提交公司董事会、2018年9月中旬提交公司股东大会审议,董事会、股东大会审议通过后,预计2019年3月底前完成员工持股计划的股票购买。\",\"KEY_CLASSIF\":\"员工持股\",\"KEY_CLASSIF_CODE\":\"008004\",\"IS_POINT\":\"1\"},{\"SECUCODE\":\"600549.SH\",\"SECURITY_CODE\":\"600549\",\"SECURITY_NAME_ABBR\":\"厦门钨业\",\"KEYWORD\":\"第一期员工持股计划完成股票购买\",\"MAINPOINT\":20,\"MAINPOINT_CONTENT\":\"2019年2月12日公告,截至2月11日,公司第一期员工持股计划已通过二级市场完成股票购买,累计买入公司股票110.12万股,占公司总股本的0.078%,成交总金额为1366.90万元,成交均价约12.41元/股,股票锁定期1年。\",\"KEY_CLASSIF\":\"员工持股\",\"KEY_CLASSIF_CODE\":\"008004\",\"IS_POINT\":\"1\"}]}"