          - generic [ref=f4e943]: 一级行业：基础材料 二级行业：金属与开采 公司网站：www.minmetalstungsten.com 公司地址：湖南省株洲市荷塘区钻石路288号钻石大厦10-12楼 公司简介：公司是在深圳证券交易所上市的高技术制造企业，是世界500强企业中国五矿集团有限公司旗下专业发展钨产业的企业。公司前身为海南金海股份有限公司，1996年12月在深圳证券交易所挂牌上市，2000年6月更名为中钨高新材料股份有限公司。公司从事的主要业务包括硬质合金和钨、钼、钽、铌等有色金属及其深加工产品和装备的研制、开发、生产、销售及贸易业务等。公司是中国五矿钨产业的运营管理平台，管理运营着集矿山、冶炼、加工、贸易于一体的完整钨产业链。公司产品广泛应用于汽车制造、航空航天、轨道交通、船舶、海洋工程装备、军工、矿山开采、掘进、机械模具加工、集成电路、钢铁冶金、半导体等制造加工领域。公司确立了“矿山是保障，冶炼是基础，合金是方向”的战略定位，全体中钨人将牢记“中国制造用中钨工具，世界制造有中国工具”的战略使命，秉承“诚信、专业、创新、高效”的共同价值观，发扬“千提百炼，其利断金”的企业精神，为建设具有全球竞争力的世界一流钨产业集团而不懈奋斗！
