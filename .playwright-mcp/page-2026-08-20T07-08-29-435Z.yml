          - heading "市盈率(PE)" [level=2] [ref=f10e254]
          - paragraph [ref=f10e255]: 市盈率（PE-TTM）使用TTM算法。市盈率 = 总市值 / 归属于母公司所有者的净利润（TTM）。 市盈率是一个重要财务指标，亦称本益比，是最常用来评估股价水平是否合理的指标之一。 一般认为市盈率越高，股价越被高估。
