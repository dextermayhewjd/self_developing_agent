            - text: （600549） 公司简介
          - generic [ref=f1e944]: 一级行业：基础材料 二级行业：金属与开采 公司网站：www.cxtc.com 公司地址：福建省厦门市思明区展鸿路81号特房波特曼财富中心A座21-22层 公司简介：公司是国家级重点高新技术企业、国家火炬计划钨材料产业基地、国家首批发展循环经济示范企业，是国家六大稀土集团之一。公司主要从事钨精矿、钨钼中间制品、粉末产品、丝材板材、硬质合金、切削刀具、各种稀土氧化物、稀土金属、稀土发光材料、磁性材料、贮氢合金粉、锂电池材料及其他能源新材料的研发、生产和销售，兼营房地产开发与经营。钨产业经过多年的发展已形成从钨矿山、冶炼、深加工到钨二次资源回收的完整钨产业链，其中灯用钨丝占世界市场的50%以上份额，钨冶炼和粉末产品、超细晶硬质合金处于国内领先水平，在国际上也有一定的影响力。稀土产业形成了从稀土矿山开发、冶炼分离、稀土功能材料(稀土永磁材料、储能材料、发光材料等)和科研应用等较为完整的产业体系。能源新材料领域建设了锂电正极材料和镍氢电池负极材料(贮氢合金)两大产品线，其中锂电正极材料包括了钴酸锂、三元材料、锰酸锂和磷酸铁锂等产品。
