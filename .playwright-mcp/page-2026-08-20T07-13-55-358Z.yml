              - generic "董秘您好，针对哈萨克斯坦项目，公司表示将严格按监管规则履行关联交易审议程序。请问若当地核心法规修订导致合作模式发生重大调整，公司是否已制定明确的风险隔离预案？大股东是否承诺承担由此产生的全部潜在损失，以杜绝向上市公司输送风险的可能？" [ref=f8e280]
