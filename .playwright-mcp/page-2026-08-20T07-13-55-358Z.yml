          - link "问 董秘您好，注意到公司回复称纳米比亚铀矿收购审批正常推进，但未明确回应是否设置业绩承诺。请问在本次收购的最终协议中，是否包含针对铀矿储量、品位或未来产能的业绩对赌及资产减值补偿条款？若无相关保护性条款，公司如何向中小股东保障此次大额海外并购的投资安全？ 答 尊敬的投资者，您好！纳米比亚项目目前尚未完成股权交割。对于该项目的收益与风险，公司持客观理性的态度：收益方面，基于标的公司铀矿资源储量及行业长期前景，公司看好其投资价值；风险方面，公司在决策前已聘请境内外专业机构完成全面尽职调查，并在协议中约定了交割先决条件、交易对方陈述与保证等前置保护机制，同时设置了分期付款安排，将付款进度与交割等关键节点挂钩，控制资金风险敞口。若交割完成，公司亦充分行使股东知情权及重大事项审议等股东权利，确保能够及时获取经营信息并有效参与重大决策。本次投资系境外资源类项目，受国际政治环境、目标国法律政策、行业周期及汇率波动等因素影响，客观上存在一定的不确定性，敬请广大投资者充分关注相关投资风险，审慎决策，理性投资。感谢您对公司的关注，谢谢！" [ref=f8e299] [cursor=pointer]:
