          - link "问 董秘您好，国家油气 “十五五” 规划明确 2030 年 CCUS 年注入 CO₂达 1000 万吨，行业迎来规模化发展机遇。想请教：公司 CCUS 吸附等核心材料技术储备情况；面向油气驱油封存场景，现有 CCUS 项目落地、项目拓展进展如何？如何看待油气 CCUS 赛道市场前景？公司捕集药剂、吸附材料现有产能，能否匹配未来油气行业大规模释放的市场需求，有无扩产规划？谢谢。 答 您好！对于吸收剂产品，公司核心技术包括核心材料TX系列、稳定性技术TX-S、核心工艺TXio。公司 TX-1系列碳捕集吸收剂采用功能导向设计，兼顾低能耗、抗降解与运行稳定性。针对传统湿法碳捕集系统蒸汽消耗较高、水平衡控制困难及预处理废水排放量较大等问题，公司 TXio二氧化碳湿法捕集工艺通过预处理功能分区、再生气洗涤、二级喷淋及再生塔顶潜热回收等设计，实现系统水平衡控制和热量高效利用。相关项目进展具体情况请关注公司公告。感谢关注。" [ref=f8e322] [cursor=pointer]:
