            - text: 是一个很好的估值指标。
            - strong [ref=f5e899]: 市销率
            - text: 在比较股票的当前估值和历史估值时表现最佳。相对于
            - link "市盈率（TTM）" [ref=f5e900] [cursor=pointer]:
              - /url: /stock/SZSE:000657/term/pettm
            - text: ，
            - strong [ref=f5e901]: 市销率
            - text: 是衡量周期性企业的绝佳评估工具。因为随着时间的流逝，公司的利润率往往会回归均值。
          - generic [ref=f5e902]:
            - text: 就股票市场整体而言，
            - strong [ref=f5e903]: 市销率
            - text: 可以用于衡量当前市场估值和市场预期收益。此时，价格是市场上交易的所有股票的总市值，而销售额是该国的GDP。这也是沃伦·巴菲特（Warren Buffett）估算整体市场估值和预测未来收益的方法。
